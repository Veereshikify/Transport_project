<!DOCTYPE html>
<html>
<head>
<title>Employee Well-Being Feedback</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
<h3>Employee Well-Being Feedback</h3>

<p class="text-muted">
This form is confidential.  
Depot managers cannot edit or delete this feedback.
</p>

<form method="post" action="/submit_feedback">

<label>Pressure Level (1 = Low, 5 = High)</label>
<input type="range" name="pressure" min="1" max="5" class="form-range" required>

<br>

<label>Is anyone forcing extra work or denying leave?</label>
<select name="manager_pressure" class="form-control" required>
    <option value="No">No</option>
    <option value="Yes">Yes</option>
</select>

<br>

<label>Describe your issue (optional)</label>
<textarea name="comments" class="form-control" rows="4"></textarea>

<br>

<button class="btn btn-primary">Submit Feedback</button>
</form>

<br>
<a href="/dashboard">Back</a>
</div>

</body>
</html>
