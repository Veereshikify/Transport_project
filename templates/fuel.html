<!DOCTYPE html>
<html>
<head>
<title>Fuel & Collection</title>
</head>

<body>

<h1>Fuel & Money Collection</h1>

<h1>Fuel & Money Collection</h1>

<form action="/check_role" method="post">
  Employee ID: <input type="text" name="emp_id"><br><br>
  <button type="submit">Proceed</button>
</form>


<br><br>

<h2>Fuel & Collection Records</h2>

<table border="1" cellpadding="10">
<tr>
  <th>ID</th>
  <th>Employee ID</th>
  <th>Name</th>
  <th>Bus No</th>
  <th>Diesel Used</th>
  <th>Money Collected</th>
  <th>Date & Time</th>
</tr>

{% for f in data %}
<tr>
  <td>{{f[0]}}</td>
  <td>{{f[1]}}</td>
  <td>{{f[2]}}</td>
  <td>{{f[3]}}</td>
  <td>{{f[4]}}</td>
  <td>{{f[5]}}</td>
  <td>{{f[6]}}</td>
</tr>
{% endfor %}
</table>

<br>
<a href="/dashboard">Back</a>

</body>
</html>
