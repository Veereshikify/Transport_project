<!DOCTYPE html>
<html>
<head>
    <title>AI Support System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h3>🤖 AI Support – Employee Assistance</h3>

    <p class="text-muted">
        This AI is private. No manager is notified unless you raise a complaint.
    </p>

    <div class="border p-3 mb-3 bg-white" style="height:300px; overflow-y:auto;">
        {% for role, msg in chat %}
            {% if role == "user" %}
                <p><b>You:</b> {{ msg }}</p>
            {% else %}
                <p><b>AI:</b> {{ msg }}</p>
            {% endif %}
        {% endfor %}
    </div>

    <form method="post">
        <textarea name="question" class="form-control"
                  placeholder="Ask your question..." required></textarea>
        <br>
        <button class="btn btn-primary">Ask AI</button>
    </form>

    <br>
    <a href="/dashboard">⬅ Back</a>
</div>

</body>
</html>
