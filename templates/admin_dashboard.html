<!DOCTYPE html>
<html>
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<title>Transport Analytics Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>

<h1>KSRTC Transport Analytics Dashboard</h1>

<h3>Total Summary</h3>

<p><b>Total Employees:</b> {{ total_employees }}</p>
<p><b>Total Trips:</b> {{ total_trips }}</p>
<p><b>Total Attendance Records:</b> {{ total_attendance }}</p>
<p><b>Total Collection ₹:</b> {{ total_collection }}</p>
<p><b>Total Diesel Used (L):</b> {{ total_diesel }}</p>

<hr>

<h2>Graphs</h2>

<canvas id="collectionChart" width="400" height="200"></canvas>
<br>
<canvas id="dieselChart" width="400" height="200"></canvas>

<script>

const busLabels = {{ bus_labels | tojson }};
const busCollection = {{ bus_collection | tojson }};
const busDiesel = {{ bus_diesel | tojson }};

new Chart(document.getElementById("collectionChart"), {
    type: "bar",
    data: {
        labels: busLabels,
        datasets: [{
            label: "Bus Collection ₹",
            data: busCollection,
            backgroundColor: "green"
        }]
    }
});

new Chart(document.getElementById("dieselChart"), {
    type: "bar",
    data: {
        labels: busLabels,
        datasets: [{
            label: "Diesel Used (L)",
            data: busDiesel,
            backgroundColor: "orange"
        }]
    }
});

</script>

<br><br>
<a href="/dashboard">Back</a>

</body>
</html>
